<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Dashboard</title>

    <link rel="icon" href="../assets/images/logo/logo.png" type="image/png" />

    <link rel="stylesheet" href="../assets/css/adminDashboard.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/patientDashboard.css" />

    <script src="../js/render.js" defer></script>
    <script src="../js/util.js" defer></script>
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
    <script type="module" src="../js/components/modals.js"></script>
    <script type="module" src="../js/patientDashboard.js" defer></script>
</head>
<body onload="renderContent()">
<div class="container">
    <div class="wrapper">
        <div id="header"></div>

        <main class="main-content">
            <input type="text" id="searchBar" class="searchBar" placeholder="شريط البحث للإخراج المخصص" />

            <div class="filter-wrapper">
                <select class="filter-select" id="filterTime">
                    <option value="">تحديد الوقت (صباح/مساء)</option>
                </select>
                <select class="filter-select" id="filterSpecialty">
                    <option value="">تحديد التخصص</option>
                </select>
            </div>

            <div id="content"></div>
        </main>

        <div id="footer"></div>
    </div>
</div>

<div id="modal" class="modal modalApp">
    <div class="modal-content">
        <span class="close" id="closeModal">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>
<script type="module">
    // استدعاء النوافذ المنبثقة بشكل إجباري لتعمل الأزرار
    import { openModal } from '../js/components/modals.js';
    window.openModal = openModal;

    // إخفاء المربع الأبيض المزعج فور تحميل الصفحة
    setTimeout(() => {
        const m = document.getElementById("modal");
        if(m) m.style.display = "none";
    }, 100);
</script>
</body>
</html>
